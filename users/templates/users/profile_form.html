{% extends "catalog/base.html" %}

{% block content %}
  <h1 class="mb-2">Профиль</h1>
  <p class="text-muted mb-4">{{ user.email }}</p>

  <div class="row g-5">
    <div class="col-md-3 text-center">
      {% if user.avatar %}
        <img src="{{ user.avatar.url }}" class="rounded-circle img-fluid border mb-2"
             style="width: 160px; height: 160px; object-fit: cover;" alt="Аватар">
      {% else %}
        <div class="rounded-circle border bg-light d-flex align-items-center justify-content-center text-muted mx-auto mb-2"
             style="width: 160px; height: 160px;">
          Нет аватара
        </div>
      {% endif %}
    </div>
    <div class="col-md-6">
      <form method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}
        {% include "users/includes/form_fields.html" %}
        <button type="submit" class="btn btn-primary">Сохранить</button>
      </form>
    </div>
  </div>
{% endblock %}
