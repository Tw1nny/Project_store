{% extends "catalog/base.html" %}

{% block content %}
  <h1 class="mb-4">Удаление статьи</h1>

  <p>Вы действительно хотите удалить статью «{{ post.title }}»? Действие нельзя отменить.</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'blog:blogpost_detail' pk=post.pk %}" class="btn btn-outline-secondary">Отмена</a>
  </form>
{% endblock %}
