{% extends "catalog/base.html" %}

{% block content %}
  <h1 class="mb-4">Удаление товара</h1>

  <p>Вы действительно хотите удалить товар «{{ product.name }}»? Действие нельзя отменить.</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'catalog:product_detail' pk=product.pk %}" class="btn btn-outline-secondary">Отмена</a>
  </form>
{% endblock %}
