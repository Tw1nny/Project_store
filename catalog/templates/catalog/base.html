{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title|default:"Интернет-магазин" }}</title>
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <style>
    body { min-height: 100vh; }
    .sidebar { min-height: 100vh; background-color: #212529; color: #fff; }
    .sidebar .brand { font-weight: 600; font-size: 1.1rem; }
    .sidebar .nav-link { color: #cfcfcf; }
    .sidebar .nav-link.active { background-color: #0d6efd; color: #fff; }
    .sidebar .nav-link:hover { color: #fff; }
    .content { padding: 2.5rem 3rem; }
    footer { border-top: 1px solid #e9ecef; padding: 1rem 3rem; color: #6c757d; font-size: 0.9rem; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

<div class="d-flex">

  <!-- ХЕДЕР / боковое меню -->
  <nav class="sidebar d-flex flex-column flex-shrink-0 p-3" style="width: 260px;">
    <a href="{% url 'catalog:home' %}" class="brand d-flex align-items-center mb-3 text-white text-decoration-none">
      <span class="badge bg-white text-dark me-2">B</span>
      Меню
    </a>
    <hr class="text-secondary">
    <ul class="nav nav-pills flex-column mb-auto">
      <li class="nav-item">
        <a href="{% url 'catalog:home' %}"
           class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
          🏠 Главная
        </a>
      </li>
      <li class="nav-item">
        <a href="{% url 'catalog:contacts' %}"
           class="nav-link {% if request.resolver_match.url_name == 'contacts' %}active{% endif %}">
          👤 Контакты
        </a>
      </li>
    </ul>
    <hr class="text-secondary">
    <div class="dropdown">
      <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
         data-bs-toggle="dropdown">
        <img src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/1f464.svg"
             width="28" height="28" class="rounded-circle me-2 bg-white p-1" alt="user">
        Пользователь
      </a>
      <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
        <li><a class="dropdown-item" href="#">Профиль</a></li>
        <li><a class="dropdown-item" href="#">Выход</a></li>
      </ul>
    </div>
  </nav>

  <!-- БОДИ -->
  <div class="flex-grow-1 d-flex flex-column">
    <main class="content flex-grow-1">
      {% block content %}{% endblock %}
    </main>

    <!-- ФУТЕР -->
    <footer>
      &copy; 2026 Учебный интернет-магазин. Все права защищены.
    </footer>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
